name: My repository has a .recomp.json
description: For a repository not on the board yet. A listed repository needs no form, its file is read every day.
title: "Manifest: "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        The board reads `.recomp.json` (or `.recomp-board.json`, its first name) at the root of
        your repository's default branch,
        creates or claims the row, and writes exactly what the file says. The file is the
        proof: whoever can commit to the repository controls the row, so it doesn't matter
        which account opens this issue.

        Already on the board? Nothing to send: the board reads the file of every listed
        repository once a day, and every later edit too. Use this form only for a repository
        not listed yet, to appear right away (on GitHub the daily job also finds new files by
        itself, but that can take days), or for one on GitLab, Codeberg, a Gitea or Forgejo
        instance.

        To create a new row the file needs at least `game`, `system` and `type`. The format
        is open and described at https://recomp.fyi/spec
  - type: input
    id: manifest_repo
    attributes:
      label: Repository with a .recomp.json
      description: The public URL of the repository, not of the file.
      placeholder: https://github.com/you/your-recomp
    validations:
      required: true
