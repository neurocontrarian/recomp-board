name: Claim or release a row
description: Take over the row of your project, or hand it back.
title: "Claim: "
labels: ["intake"]
body:
  - type: markdown
    attributes:
      value: |
        Open this from the GitHub account that owns the repository. A claimed row is yours
        alone to edit and the periodic scan stops touching it. Releasing it keeps the row on
        the board, unclaimed, and anyone may correct it again.

        Faster, and without matching accounts: commit a `.recomp-board.json` to the repository
        and use the manifest form instead.
  - type: input
    id: row
    attributes:
      label: Row ID or repository URL
      description: The ID is in the last column of the table.
      placeholder: wave-race-64-yourname
    validations:
      required: true
  - type: dropdown
    id: action
    attributes:
      label: What to do
      options:
        - Claim this row
        - Release this row
    validations:
      required: true
